<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E8ECF1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1116" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Tema antes do primeiro paint (mesma regra de src/lib/theme.ts): localStorage 'theme' = light | dark;
         sem valor = Sistema (prefers-color-scheme). -->
    <script>
      (function () {
        var C = { light: '#E8ECF1', dark: '#0E1116' }, p = null
        try { p = localStorage.getItem('theme') } catch (e) {}
        if (p !== 'light' && p !== 'dark') p = null
        var t = p || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
        document.documentElement.setAttribute('data-theme', t)
        var m = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < m.length; i++) if (p) m[i].setAttribute('content', C[t])
        if (t === 'light') document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').setAttribute('content', 'default')
      })()
    </script>
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Fitness Kaluan</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
